server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: trading-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

predictor:
  base-url: ${PREDICTOR_URL:https://predictor-ml-zntu.onrender.com}
  api-key: ${PREDICTOR_API_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

alerts:
  check-interval-ms: ${ALERT_CHECK_INTERVAL_MS:300000}   # 5 min
  initial-delay-ms: ${ALERT_INITIAL_DELAY_MS:30000}

logging:
  level:
    com.tradingapp: INFO
