spring:
  application:
    name: stock-predictor

  datasource:
    # username/password intentionally omitted here: Spring treats a whitespace-only
    # password as unset, so local credentials are passed as JDBC URL query params
    # instead (see the default below). Override DATABASE_URL entirely for other envs.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stock_predictor?schema=public&user=postgres&password=password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  twelvedata:
    api-key: ${TWELVE_DATA_API_KEY:}
    base-url: https://api.twelvedata.com
  ingestion:
    cron: ${INGESTION_CRON:0 0 18 * * *}
  accuracy:
    cron: ${ACCURACY_CRON:0 0 19 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  batch:
    auth-token: ${BATCH_AUTH_TOKEN:}

logging:
  level:
    com.stock_predictor: INFO
