spring:
  task:
    scheduling:
      enabled: false

  datasource:
    # username/password intentionally omitted: Spring's property binding treats a
    # whitespace-only password as unset, so credentials here are passed as JDBC URL
    # query params instead (pgjdbc doesn't support user:pass@host userinfo syntax).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:3000/stock_predictor?schema=public&user=postgres&password=%20%20%20%20}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

app:
  fmp:
    api-key: test-key
    base-url: http://localhost:9090
  ingestion:
    cron: "-"
    price-lookback-days: 30
  accuracy:
    cron: "-"
