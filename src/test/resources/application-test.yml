spring:
  task:
    scheduling:
      enabled: false

  datasource:
    url: jdbc:h2:mem:stock_predictor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

app:
  twelvedata:
    api-key: test-key
    base-url: http://localhost:9090
  ingestion:
    cron: "-"
  accuracy:
    cron: "-"
